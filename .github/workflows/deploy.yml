name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Cache World Cup open-data export
        id: worldcup-cache
        uses: actions/cache@v4
        with:
          path: |
            src/data/worldcup/2022/
            src/data/worldcup/2022-players.json
            public/data/worldcup-2022/
          key: worldcup-2022-v2-${{ hashFiles('scripts/build-worldcup-2022.mjs') }}

      - name: Generate all 64 World Cup games
        if: steps.worldcup-cache.outputs.cache-hit != 'true'
        run: npm run data:worldcup

      - name: Verify World Cup extraction rules
        run: npm run test:worldcup

      - name: Test Pulse engine
        run: npm run test:pulse

      - name: Test Messi Paintball / chronology
        run: node --test tests/pass-wars.test.mjs

      - name: Verify above-50 activity persistence
        run: npm run test:presence

      - name: Browser interaction smoke tests
        run: npm run test:browser

      - name: Check and build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
