name: Check Mbappé match activity profile
on:
  pull_request:
    paths:
      - 'src/pages/matchs/**'
      - 'src/lib/pass-wars-engine.*'
      - 'tests/pass-wars.test.mjs'
      - 'src/styles/pass-wars.css'
      - 'src/data/players/**'
      - 'public/data/players/**'
      - 'src/data/matches/**'
      - 'src/lib/match-activity.*'
      - 'src/lib/explorer-data.mjs'
      - 'src/pages/joueurs/**'
      - 'src/pages/equipes/**'
      - 'src/components/ActivityMiniChart.astro'
      - 'src/styles/match-explorer.css'
      - 'src/styles/match-profile-detail.css'
      - 'src/lib/match-activity.d.mts'
      - 'public/data/matches/**'
      - 'src/styles/match-weather.css'
      - 'src/styles/messi-constellation.css'
      - 'src/styles/global.css'
      - 'src/pages/index.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/match-profile-check.yml'
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate data source and event timings
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { computeActivity, computePulse, computeMatchProfiles, actionImpact, pulseWeight, smoothVisual, PULSE_RULES } from './src/lib/match-activity.mjs';
          import { games, playerList, commonScale } from './src/lib/explorer-data.mjs';
          const path = 'src/data/matches/2022-final-mbappe.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const publicData = JSON.parse(fs.readFileSync('public/data/matches/2022-final-mbappe.json','utf8'));
          assert.deepEqual(data, publicData, 'Astro copy and downloadable JSON must match');
          assert.equal(data.match.id, 3869685);
          assert.equal(data.player.id, 3009);
          assert.equal(data.summary.goals, 3);
          assert.deepEqual(data.goals.filter(g=>g.for_player).map(g=>g.minute), [80,81,118]);
          assert.equal(data.timeline.length, 126);
          assert.equal(Math.max(...data.timeline.map(p=>p.activity)), 100);
          assert.equal(data.methodology.shootout_excluded, true);
          assert.ok(data.timeline.every(p=>p.activity>=0 && p.activity<=100));
          const actions = JSON.parse(fs.readFileSync('src/data/matches/2022-final-mbappe-actions.json','utf8'));
          assert.equal(actions.match_id, 3869685);
          assert.equal(actions.player_id, 3009);
          assert.equal(actions.events.length, 148);
          assert.equal(actions.events.filter(e=>e.kind==='Pass' && e.outcome==='Complete').length, 19);
          assert.equal(actions.events.filter(e=>e.kind==='Dribble' && e.outcome==='Complete').length, 6);
          assert.deepEqual(actions.events.filter(e=>e.kind==='Shot' && e.outcome==='Goal').map(e=>e.minute), [80,81,118]);
          assert.ok(actions.events.every(e=>Number.isInteger(e.minute) && e.minute>=1 && e.minute<=125));
          const {timeline: scores} = computeActivity(actions.events,125);
          assert.equal(scores.length,126);
          assert.equal(scores[0].activity,50);
          for(let minute=1;minute<scores.length;minute++){
            const gain = actions.events.filter(e=>e.minute===minute).reduce((sum,e)=>sum+actionImpact(e),0);
            assert.equal(scores[minute].activity,Math.max(0,scores[minute-1].activity-1)+gain);
          }
          assert.equal(actionImpact({kind:'Pass',outcome:'Incomplete'}),0);
          assert.equal(actionImpact({kind:'Pass',outcome:'Complete'}),5);
          assert.equal(actionImpact({kind:'Dribble',outcome:'Complete'}),5);
          assert.equal(actionImpact({kind:'Shot',outcome:'Goal'}),45);
          assert.equal(computeActivity([],125).timeline[125].activity,0);
          // V4 : le score démarre à 50 sur le terrain, les actions créent des impulsions causales.
          assert.equal(PULSE_RULES.shortHalfLife,3);
          assert.equal(PULSE_RULES.longHalfLife,10);
          assert.deepEqual(pulseWeight({kind:'Pass',outcome:'Complete'}),{activity:1,impact:0.5});
          assert.ok(pulseWeight({kind:'Dribble',outcome:'Complete'}).activity>pulseWeight({kind:'Pass',outcome:'Complete'}).activity);
          const pulse=computePulse([{minute:4,second:30,kind:'Dribble',outcome:'Complete'}],30).timeline;
          assert.ok(pulse[3].activity>0 && pulse[3].activity<50);
          assert.ok(pulse[4].activity>0 && pulse[4].impact>0);
          assert.ok(pulse[5].activity<pulse[4].activity);
          assert.ok(pulse[10].activity<pulse[5].activity);
          assert.equal(computePulse([],90).timeline[0].activity,50);
          assert.ok(computePulse([],90).timeline[90].activity<10);
          assert.ok(pulse.every(p=>p.activity>=0 && p.activity<=100 && p.impact>=0 && p.impact<=100));
          const secondPulse=computePulse([{minute:4,second:0,kind:'Pass',outcome:'Complete'},{minute:4,second:59,kind:'Pass',outcome:'Complete'}],20).timeline;
          assert.equal(secondPulse[4].gain,2);
          const off=computePulse([{minute:1,second:15,kind:'Pass',outcome:'Complete'}],20,{entry:5,exit:9}).timeline;
          assert.equal(off[4].activity,null);
          assert.equal(off[5].activity,50);
          assert.equal(off[9].activity,null);
          assert.equal(games.length,7);
          assert.equal(playerList.length,24);
          assert.equal(commonScale,100);
          for (const game of games) {
            assert.equal(game.team.length,game.duration+1);
            assert.ok(game.profiles.length>=11);
            assert.ok(game.team.every(point=>point.activity>=0 && point.activity<=100 && point.impact>=0 && point.impact<=100 && point.players>0 && Number.isFinite(point.activity)));
            const playerIds=new Set(game.players.map(p=>p.id));
            assert.ok(game.actions.every(a=>playerIds.has(a.p) && a.m>=0 && a.m<=game.duration));
            assert.equal(game.profiles.filter(p=>p.player.id===3009).length,1);
            for(const profile of game.profiles) {
              assert.equal(profile.timeline.length,game.duration+1);
              assert.ok(profile.timeline[profile.player.entry].activity>=0 && profile.timeline[profile.player.entry].activity<=100);
              if(profile.player.entry>0)assert.equal(profile.timeline[profile.player.entry-1].activity,null);
              const display=smoothVisual(profile.timeline);
              assert.equal(display.length,profile.timeline.length);
              assert.ok(profile.timeline.every(p=>p.activity==null || p.activity>=0 && p.activity<=100));
              assert.ok(profile.timeline.every(p=>p.impact==null || p.impact>=0 && p.impact<=100));
              assert.ok(display.every((p,i)=>p.activity==null || p.activity>=0));
            }
          }
          const messiFile = 'src/data/matches/2022-final-messi-passes.json';
          if (fs.existsSync(messiFile)) {
            const network = JSON.parse(fs.readFileSync(messiFile,'utf8'));
            const published = JSON.parse(fs.readFileSync('public/data/matches/2022-final-messi-passes.json','utf8'));
            assert.deepEqual(network,published);
            assert.equal(network.schema_version,1);
            assert.equal(network.match.id,3869685);
            assert.equal(network.selection.completed_only,true);
            assert.equal(network.players.length,10);
            assert.ok(network.passes.length>0);
            assert.equal(network.summary.shown_passes,network.passes.length);
            assert.equal(network.summary.given+network.summary.received,network.passes.length);
            assert.ok(network.passes.every(p=>p.partner_id&&['given','received'].includes(p.direction)));
          }
          JS
      - name: Validate Pass Wars engine and source consistency
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { bootPassWars } from './src/lib/pass-wars-engine.mjs';
          assert.equal(typeof bootPassWars,'function');
          for(const file of ['messi-pass-wars.json','messi-pass-wars-events.json']) {
            const src='src/data/players/'+file, dest='public/data/players/'+file;
            if(fs.existsSync(src)) {
              assert.deepEqual(JSON.parse(fs.readFileSync(src,'utf8')),JSON.parse(fs.readFileSync(dest,'utf8')));
            }
          }
          if(fs.existsSync('src/data/players/messi-pass-wars.json')) {
            const a=JSON.parse(fs.readFileSync('src/data/players/messi-pass-wars.json','utf8'));
            const b=JSON.parse(fs.readFileSync('src/data/players/messi-pass-wars-events.json','utf8'));
            assert.equal(a.schema_version,2);
            assert.equal(a.summary.total,b.events.length);
            assert.equal(a.scope.complete_career,false);
          }
          JS
      - name: Verify paintball pass selection threshold
        run: node --test tests/pass-wars.test.mjs
      - name: Cache World Cup open-data export
        id: worldcup-cache
        uses: actions/cache@v4
        with:
          path: |
            src/data/worldcup/2022/
            src/data/worldcup/2022-players.json
            public/data/worldcup-2022/
          key: worldcup-2022-v2-${{ hashFiles('scripts/build-worldcup-2022.mjs') }}
      - name: Generate World Cup dataset when absent
        if: steps.worldcup-cache.outputs.cache-hit != 'true'
        run: npm run data:worldcup
      - name: Verify World Cup extraction rules
        run: npm run test:worldcup
      - name: Astro typecheck and static build
        run: npm run build
